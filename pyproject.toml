[project]
name = "pybase"
version = "0.1.0"
description = "A modular, extensible FastAPI backend scaffold"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "acryl-sqlglot>=25.25.2.dev9",
    "datahub>=0.999.1",
    "fastapi>=0.116,<1.0",
    "pydantic-settings>=2.10,<3.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0,<7.0",
    "uvicorn[standard]>=0.35,<1.0",
    "bcrypt>=4.0,<5.0",
    "PyJWT>=2.8,<3.0",
    "langchain-core>=1.6.0",
    "sqlalchemy>=2.0.52",
    "aiomysql>=0.3.2",
    "langchain-openai>=1.6.0",
    "langchain>=1.3.16",
    "langgraph-checkpoint-redis>=0.1.0",
    "langchain-mcp-adapters>=0.3.2",
    "mcp>=1.29.1",
]

[project.optional-dependencies]
database = [
    "alembic>=1.16,<2.0",
    "sqlalchemy[asyncio]>=2.0.41,<3.0",
]
database-postgresql = [
    "alembic>=1.16,<2.0",
    "asyncpg>=0.30,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "sqlalchemy[asyncio]>=2.0.41,<3.0",
]
database-sqlite = [
    "aiosqlite>=0.21,<1.0",
    "alembic>=1.16,<2.0",
    "sqlalchemy[asyncio]>=2.0.41,<3.0",
]
database-mysql = [
    "aiomysql>=0.2.0,<1.0",
    "alembic>=1.16,<2.0",
    "pymysql>=1.1,<2.0",
    "sqlalchemy[asyncio]>=2.0.41,<3.0",
]

llm = [
    "langchain",
    "langchain-openai",
    "langchain-community",
]

[project.scripts]
pybase = "pybase.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pybase"]
