<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Northstar · 登录</title><link rel="stylesheet" href="styles.css"></head><body class="login-page"><main class="login-shell"><div class="login-card"><div class="auth-brand"><span class="brand-mark">N</span><span>NORTHSTAR / ACCESS</span></div><h1 id="authTitle">欢迎回来</h1><p id="authDesc">登录你的 Focus Agent 工作空间。</p><form id="authForm" class="auth-form"><div class="field register-only" hidden><label>姓名</label><input name="real_name" placeholder="你的姓名"></div><div class="field"><label>用户名</label><input name="username" required placeholder="username"></div><div class="field"><label>密码</label><input name="password" required type="password" placeholder="至少 6 位"></div><button class="primary auth-submit" type="submit" id="authSubmit">登录</button></form><div class="auth-switch"><span id="authSwitchText">还没有账号？</span><button type="button" id="authSwitch">注册新账号</button></div><div id="loginToast" class="login-error" role="alert"></div></div></main><script src="login.js" defer></script></body></html>
