tables:
  dept:
    description: 部门表
    columns:
      dept_id:   {type: int, comment: 部门ID, key: PRI, nullable: false}
      dept_name: {type: varchar(50), comment: 部门名称, nullable: false}

  emp:
    description: 员工表
    columns:
      emp_id:    {type: int, comment: 员工ID, key: PRI, nullable: false}
      emp_name:  {type: varchar(50), comment: 员工姓名, nullable: false}
      dept_id:   {type: int, comment: 所属部门ID, key: MUL, nullable: false}
      manager_id: {type: int, comment: 上级ID, nullable: true}
    foreignKeys:
      - {column: dept_id, refTable: dept, refColumn: dept_id}
      - {column: manager_id, refTable: emp, refColumn: emp_id}

glossary:
  - term: 在职员工
    description: 状态为在职的员工
    sqlFragment: "status = 1"
    synonyms: [活跃员工]