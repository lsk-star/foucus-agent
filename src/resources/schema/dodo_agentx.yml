# 京东广告投放 Agent 演示数据字典
# 数据均为虚构数据，不对应任何真实客户、账户或生产系统。
# 与 sql/ad_platform_v2.sql 保持一致。

tables:
  app_user:
    description: 营销分析系统的登录用户，不是广告触达用户。
    columns:
      id: { type: bigint unsigned, comment: 主键ID, key: PRI, nullable: false }
      username: { type: varchar(64), comment: 登录账号, key: UNI, nullable: false }
      password_hash: { type: varchar(255), comment: 仅存 Argon2/bcrypt 哈希，绝不存明文密码, nullable: false }
      real_name: { type: varchar(64), comment: 真实姓名, nullable: false }
      mobile: { type: varchar(32), comment: 手机号, nullable: true }
      email: { type: varchar(128), comment: 邮箱, nullable: true }
      avatar_url: { type: varchar(500), comment: 头像URL, nullable: true }
      job_title: { type: varchar(64), comment: 如投放优化师、运营负责人, nullable: true }
      status: { type: "enum('ACTIVE', 'DISABLED')", comment: 状态, nullable: false }
      last_login_at: { type: datetime, comment: 最后登录时间, nullable: true }
      created_at: { type: datetime, comment: 创建时间, nullable: false }
      updated_at: { type: datetime, comment: 更新时间, nullable: false }

  marketing_channel:
    description: 广告渠道，如巨量引擎、腾讯广告、Google Ads。
    columns:
      id: { type: bigint unsigned, comment: 主键ID, key: PRI, nullable: false }
      channel_code: { type: varchar(64), comment: 渠道编码, key: UNI, nullable: false }
      channel_name: { type: varchar(128), comment: 渠道名称, nullable: false }
      status: { type: "enum('ACTIVE', 'INACTIVE')", comment: 状态, nullable: false }
      created_at: { type: datetime, comment: 创建时间, nullable: false }

  ad_account:
    description: 广告平台账户，也是数据权限最小单元。
    columns:
      id: { type: bigint unsigned, comment: 主键ID, key: PRI, nullable: false }
      channel_id: { type: bigint unsigned, comment: 渠道ID, key: MUL, nullable: false }
      platform_account_id: { type: varchar(128), comment: 广告平台侧账户 ID, nullable: false }
      account_name: { type: varchar(255), comment: 账户名称, nullable: false }
      currency_code: { type: char(3), comment: 货币代码, nullable: false }
      status: { type: "enum('ACTIVE', 'PAUSED', 'DISABLED')", comment: 状态, nullable: false }
      created_at: { type: datetime, comment: 创建时间, nullable: false }
      updated_at: { type: datetime, comment: 更新时间, nullable: false }

  user_ad_account:
    description: 用户可访问的广告账户；一个用户可拥有多个账户。
    columns:
      app_user_id: { type: bigint unsigned, comment: 应用用户ID, key: PRI, nullable: false }
      ad_account_id: { type: bigint unsigned, comment: 广告账户ID, key: PRI, nullable: false }
      role: { type: "enum('OWNER', 'ANALYST', 'OPERATOR', 'VIEWER')", comment: 角色, nullable: false }
      granted_at: { type: datetime, comment: 授权时间, nullable: false }
      expires_at: { type: datetime, comment: 过期时间, nullable: true }

  campaign:
    description: 广告计划 Campaign。
    columns:
      id: { type: bigint unsigned, comment: 主键ID, key: PRI, nullable: false }
      account_id: { type: bigint unsigned, comment: 广告账户ID, key: MUL, nullable: false }
      platform_campaign_id: { type: varchar(128), comment: 平台侧广告计划ID, nullable: false }
      campaign_name: { type: varchar(255), comment: 广告计划名称, nullable: false }
      objective: { type: varchar(64), comment: 营销目标：TRAFFIC、LEAD、SALES 等, nullable: true }
      optimization_goal: { type: varchar(64), comment: 优化目标：CLICK、PURCHASE、FORM_SUBMIT 等, nullable: true }
      daily_budget: { type: decimal(18,2), comment: 日预算, nullable: true }
      status: { type: "enum('ACTIVE', 'PAUSED', 'ENDED', 'DELETED')", comment: 状态, nullable: false }
      start_date: { type: date, comment: 开始日期, nullable: true }
      end_date: { type: date, comment: 结束日期, nullable: true }
      created_at: { type: datetime, comment: 创建时间, nullable: false }
      updated_at: { type: datetime, comment: 更新时间, nullable: false }

  ad_group:
    description: 广告组，配置定向、出价与人群。
    columns:
      id: { type: bigint unsigned, comment: 主键ID, key: PRI, nullable: false }
      campaign_id: { type: bigint unsigned, comment: 广告计划ID, key: MUL, nullable: false }
      platform_ad_group_id: { type: varchar(128), comment: 平台侧广告组ID, nullable: false }
      ad_group_name: { type: varchar(255), comment: 广告组名称, nullable: false }
      targeting_type: { type: "enum('AUTO', 'MANUAL', 'AUDIENCE')", comment: 定向类型, nullable: true }
      bid_strategy: { type: varchar(64), comment: 如 LOWEST_COST、TARGET_CPA, nullable: true }
      bid_amount: { type: decimal(18,4), comment: 出价金额, nullable: true }
      status: { type: "enum('ACTIVE', 'PAUSED', 'ENDED', 'DELETED')", comment: 状态, nullable: false }
      created_at: { type: datetime, comment: 创建时间, nullable: false }
      updated_at: { type: datetime, comment: 更新时间, nullable: false }

  audience_package:
    description: 广告定向使用的人群包。
    columns:
      id: { type: bigint unsigned, comment: 主键ID, key: PRI, nullable: false }
      package_id: { type: varchar(128), comment: 系统人群包编码, key: UNI, nullable: false }
      account_id: { type: bigint unsigned, comment: 广告账户ID, nullable: false }
      platform_package_id: { type: varchar(128), comment: 平台侧人群包ID, nullable: true }
      package_name: { type: varchar(255), comment: 人群包名称, nullable: false }
      package_type: { type: "enum('DMP', 'CUSTOM', 'LOOKALIKE', 'INTEREST', 'RETARGETING', 'EXCLUSION', 'AUTO')", comment: 人群包类型, nullable: false }
      source_platform: { type: varchar(64), comment: 数坊、京腾魔方、DMP、平台人群中心, nullable: true }
      estimated_size: { type: bigint unsigned, comment: 预估人群规模, nullable: true }
      definition_json: { type: json, comment: 人群定义JSON, nullable: true }
      status: { type: tinyint, comment: 1有效，0失效, nullable: false }
      created_at: { type: datetime, comment: 创建时间, nullable: false }

  ad_group_audience_relation:
    description: 广告单元与定向人群包的绑定关系。
    columns:
      id: { type: bigint unsigned, comment: 主键ID, key: PRI, nullable: false }
      ad_group_id: { type: bigint unsigned, comment: 广告组ID, nullable: false }
      package_id: { type: varchar(128), comment: 人群包ID, nullable: false }
      usage_type: { type: "enum('INCLUDE', 'EXCLUDE')", comment: 使用类型，包含或排除, nullable: false }
      status: { type: tinyint, comment: 1有效，0解绑或失效, nullable: false }
      bound_at: { type: datetime, comment: 绑定时间, nullable: false }

  creative:
    description: 创意素材库。
    columns:
      id: { type: bigint unsigned, comment: 主键ID, key: PRI, nullable: false }
      creative_code: { type: varchar(128), comment: 创意编码, key: UNI, nullable: false }
      creative_name: { type: varchar(255), comment: 创意名称, nullable: false }
      creative_type: { type: "enum('IMAGE', 'VIDEO', 'CAROUSEL', 'TEXT', 'LIVE', 'OTHER')", comment: 创意类型, nullable: false }
      title: { type: varchar(500), comment: 标题, nullable: true }
      body_text: { type: text, comment: 正文, nullable: true }
      material_url: { type: text, comment: 素材URL, nullable: true }
      created_at: { type: datetime, comment: 创建时间, nullable: false }
      updated_at: { type: datetime, comment: 更新时间, nullable: false }

  ad:
    description: 具体广告对象。
    columns:
      id: { type: bigint unsigned, comment: 主键ID, key: PRI, nullable: false }
      ad_group_id: { type: bigint unsigned, comment: 广告组ID, key: MUL, nullable: false }
      platform_ad_id: { type: varchar(128), comment: 平台侧广告ID, nullable: false }
      ad_name: { type: varchar(255), comment: 广告名称, nullable: false }
      landing_page_url: { type: text, comment: 落地页URL, nullable: true }
      status: { type: "enum('ACTIVE', 'PAUSED', 'ENDED', 'DELETED')", comment: 状态, nullable: false }
      created_at: { type: datetime, comment: 创建时间, nullable: false }
      updated_at: { type: datetime, comment: 更新时间, nullable: false }

  ad_creative:
    description: 广告与素材的多对多关系。
    columns:
      ad_id: { type: bigint unsigned, comment: 广告ID, key: PRI, nullable: false }
      creative_id: { type: bigint unsigned, comment: 创意ID, key: PRI, nullable: false }
      is_primary: { type: tinyint(1), comment: 是否为主素材, nullable: false }

  ad_performance_daily:
    description: 广告平台日报核心事实表。
    columns:
      id: { type: bigint unsigned, comment: 主键ID, key: PRI, nullable: false }
      stat_date: { type: date, comment: 统计日期, nullable: false }
      account_id: { type: bigint unsigned, comment: 广告账户ID, nullable: false }
      campaign_id: { type: bigint unsigned, comment: 广告计划ID, nullable: false }
      ad_group_id: { type: bigint unsigned, comment: 广告组ID, nullable: false }
      ad_id: { type: bigint unsigned, comment: 广告ID, nullable: false }
      creative_id: { type: bigint unsigned, comment: 创意ID, nullable: true }
      audience_id: { type: bigint unsigned, comment: 人群包ID, nullable: true }
      placement_code: { type: varchar(64), comment: 广告位代码, nullable: false }
      region_code: { type: varchar(64), comment: 地域代码, nullable: false }
      age_group: { type: varchar(32), comment: 年龄段, nullable: false }
      gender: { type: varchar(16), comment: 性别, nullable: false }
      device_type: { type: varchar(32), comment: 设备类型, nullable: false }
      cost: { type: decimal(18,2), comment: 花费, nullable: false }
      impressions: { type: bigint unsigned, comment: 曝光量, nullable: false }
      clicks: { type: bigint unsigned, comment: 点击量, nullable: false }
      platform_conversions: { type: decimal(18,4), comment: 平台转化量, nullable: false }
      platform_conversion_value: { type: decimal(18,2), comment: 平台转化价值, nullable: false }
      currency_code: { type: char(3), comment: 货币代码, nullable: false }
      source_updated_at: { type: datetime, comment: 源数据更新时间, nullable: true }
      created_at: { type: datetime, comment: 创建时间, nullable: false }
      updated_at: { type: datetime, comment: 更新时间, nullable: false }

  customer:
    description: 实际到达企业站点的匿名访客或客户。
    columns:
      id: { type: bigint unsigned, comment: 主键ID, key: PRI, nullable: false }
      anonymous_id: { type: char(64), comment: 埋点生成的匿名访客标识或哈希标识, key: UNI, nullable: true }
      crm_customer_id: { type: varchar(128), comment: CRM 客户 ID, key: UNI, nullable: true }
      first_seen_at: { type: datetime, comment: 首次发现时间, nullable: true }
      created_at: { type: datetime, comment: 创建时间, nullable: false }

  ad_touchpoint:
    description: 企业埋点收到的广告曝光、点击或浏览触点。
    columns:
      id: { type: bigint unsigned, comment: 主键ID, key: PRI, nullable: false }
      customer_id: { type: bigint unsigned, comment: 客户ID, nullable: true }
      occurred_at: { type: datetime, comment: 发生时间, nullable: false }
      touch_type: { type: "enum('IMPRESSION', 'CLICK', 'VIEW')", comment: 触点类型, nullable: false }
      account_id: { type: bigint unsigned, comment: 广告账户ID, nullable: true }
      campaign_id: { type: bigint unsigned, comment: 广告计划ID, nullable: true }
      ad_group_id: { type: bigint unsigned, comment: 广告组ID, nullable: true }
      ad_id: { type: bigint unsigned, comment: 广告ID, nullable: true }
      creative_id: { type: bigint unsigned, comment: 创意ID, nullable: true }
      platform_click_id: { type: varchar(255), comment: 平台点击ID, nullable: true }
      created_at: { type: datetime, comment: 创建时间, nullable: false }

  conversion_event:
    description: 企业确认的原始转化事件。
    columns:
      id: { type: bigint unsigned, comment: 主键ID, key: PRI, nullable: false }
      customer_id: { type: bigint unsigned, comment: 客户ID, nullable: true }
      event_id: { type: varchar(128), comment: 事件ID, key: UNI, nullable: false }
      event_type: { type: "enum('LEAD', 'REGISTER', 'ADD_TO_CART', 'PURCHASE', 'OTHER')", comment: 事件类型, nullable: false }
      occurred_at: { type: datetime, comment: 发生时间, nullable: false }
      event_value: { type: decimal(18,2), comment: 事件价值, nullable: false }
      currency_code: { type: char(3), comment: 货币代码, nullable: true }
      source_system: { type: varchar(64), comment: 来源系统，如WEB、APP、CRM、OMS, nullable: false }
      created_at: { type: datetime, comment: 创建时间, nullable: false }

  attribution_result:
    description: 转化事件与广告触点之间的归因结果。
    columns:
      id: { type: bigint unsigned, comment: 主键ID, key: PRI, nullable: false }
      conversion_event_id: { type: bigint unsigned, comment: 转化事件ID, nullable: false }
      touchpoint_id: { type: bigint unsigned, comment: 触点ID, nullable: false }
      attribution_model: { type: "enum('LAST_CLICK', 'LAST_NON_DIRECT_CLICK', 'FIRST_CLICK', 'LINEAR', 'PLATFORM_REPORTED')", comment: 归因模型, nullable: false }
      click_window_days: { type: smallint unsigned, comment: 点击归因窗口期（天）, nullable: false }
      view_window_days: { type: smallint unsigned, comment: 浏览归因窗口期（天）, nullable: false }
      credit: { type: decimal(9,6), comment: 归因权重, nullable: false }
      attributed_value: { type: decimal(18,2), comment: 归因价值, nullable: false }
      created_at: { type: datetime, comment: 创建时间, nullable: false }

  sales_order:
    description: 企业订单事实；净收入=支付金额-退款金额。
    columns:
      id: { type: bigint unsigned, comment: 主键ID, key: PRI, nullable: false }
      customer_id: { type: bigint unsigned, comment: 客户ID, nullable: true }
      conversion_event_id: { type: bigint unsigned, comment: 转化事件ID, nullable: true }
      order_no: { type: varchar(128), comment: 订单号, key: UNI, nullable: false }
      order_status: { type: "enum('PENDING', 'PAID', 'CANCELLED', 'REFUNDED', 'PARTIALLY_REFUNDED')", comment: 订单状态, nullable: false }
      paid_at: { type: datetime, comment: 支付时间, nullable: true }
      gross_amount: { type: decimal(18,2), comment: 总金额, nullable: false }
      refund_amount: { type: decimal(18,2), comment: 退款金额, nullable: false }
      currency_code: { type: char(3), comment: 货币代码, nullable: false }
      created_at: { type: datetime, comment: 创建时间, nullable: false }

  promotion_target:
    description: 广告实际推广对象，如京东SKU、快手直播间、落地页。
    columns:
      id: { type: bigint unsigned, comment: 主键ID, key: PRI, nullable: false }
      account_id: { type: bigint unsigned, comment: 广告账户ID, nullable: false }
      target_type: { type: "enum('SKU', 'SPU', 'SHOP', 'LIVE_ROOM', 'LANDING_PAGE')", comment: 推广对象类型, nullable: false }
      platform_target_id: { type: varchar(128), comment: 平台侧推广对象ID, nullable: false }
      target_name: { type: varchar(255), comment: 推广对象名称, nullable: false }
      target_price: { type: decimal(18,2), comment: 推广对象价格, nullable: true }
      status: { type: tinyint, comment: 状态, nullable: false }
      created_at: { type: datetime, comment: 创建时间, nullable: false }

  ad_group_target_relation:
    description: 广告单元绑定的商品、店铺或直播间。
    columns:
      ad_group_id: { type: bigint unsigned, comment: 广告组ID, key: PRI, nullable: false }
      promotion_target_id: { type: bigint unsigned, comment: 推广对象ID, key: PRI, nullable: false }

  ad_group_keyword:
    description: 京东搜索快车等搜索广告的关键词定向。
    columns:
      id: { type: bigint unsigned, comment: 主键ID, key: PRI, nullable: false }
      ad_group_id: { type: bigint unsigned, comment: 广告组ID, nullable: false }
      keyword_text: { type: varchar(255), comment: 关键词文本, nullable: false }
      match_type: { type: "enum('EXACT', 'PHRASE', 'BROAD')", comment: 匹配类型, nullable: false }
      bid_amount: { type: decimal(18,4), comment: 出价金额, nullable: true }
      status: { type: tinyint, comment: 状态, nullable: false }

glossary:
  - term: 渠道
    description: 广告投放平台。当前系统包含巨量引擎、磁力金牛和京东广告。
    sqlFragment: "JOIN marketing_channel mc ON mc.id = aa.channel_id"
    synonyms: [ 媒体, 广告平台, 媒体渠道, channel, media ]

  - term: 广告账户
    description: 广告主在某个广告渠道中的投放账户，是当前系统的数据权限最小单元。
    sqlFragment: "p.account_id = aa.id"
    synonyms: [ 账户, 投放账户, 媒体账户, ad account ]

  - term: 我的账户
    description: 当前登录用户拥有权限的广告账户，不由LLM判断，必须由Harness根据user_ad_account注入账户范围。
    sqlFragment: "p.account_id IN (:authorized_account_ids)"
    synonyms: [ 我负责的账户, 我能看的账户, 我的投放账户 ]

  - term: 投放计划
    description: 广告平台中的上层营销计划，统一映射到campaign。巨量、磁力金牛、京东的具体命名可能不同。
    sqlFragment: "JOIN campaign c ON c.id = p.campaign_id"
    synonyms: [ Campaign, 广告组, 商品计划, 推广计划, 计划 ]

  - term: 广告单元
    description: 投放计划下配置人群、出价、预算策略和推广对象的单元，统一映射到ad_group。
    sqlFragment: "JOIN ad_group ag ON ag.id = p.ad_group_id"
    synonyms: [ 单元, 推广单元, Ad Group, 广告计划 ]

  - term: 广告
    description: 实际参与平台投放的广告对象，通常关联创意素材或落地页。
    sqlFragment: "JOIN ad ad ON ad.id = p.ad_id"
    synonyms: [ 投放广告, 广告创意, ad ]

  - term: 素材
    description: 图片、视频、标题、文案等创意资产。一个广告可使用一个或多个素材。
    sqlFragment: "JOIN creative cr ON cr.id = p.creative_id"
    synonyms: [ 创意, 广告素材, creative, 素材内容 ]

  - term: 视频素材
    description: 素材类型为VIDEO的广告创意。
    sqlFragment: "cr.creative_type = 'VIDEO'"
    synonyms: [ 视频, 短视频, 视频创意, video ]

  - term: 图片素材
    description: 素材类型为IMAGE的广告创意。
    sqlFragment: "cr.creative_type = 'IMAGE'"
    synonyms: [ 图片, 静态图, 图片创意, image ]

  - term: 人群包
    description: 来源于巨量云图、磁力万象、京腾魔方或DMP的广告定向人群。查询广告单元绑定人群时，通过ad_group_audience_relation关联；当前系统仅查询，不执行人群创建或绑定。
    sqlFragment: "JOIN ad_group_audience_relation r ON r.ad_group_id = ag.id AND r.status = 1 JOIN audience_package ap ON ap.package_id = r.package_id"
    synonyms: [ 定向人群, 人群, audience, crowd package ]

  - term: 包含人群
    description: 广告单元主动投放的人群包。
    sqlFragment: "r.usage_type = 'INCLUDE'"
    synonyms: [ 定向人群, 纳入人群, include audience ]

  - term: 排除人群
    description: 广告单元主动排除的人群包，例如已购用户，避免重复触达。
    sqlFragment: "r.usage_type = 'EXCLUDE'"
    synonyms: [ 排除包, 排除用户, exclude audience ]

  - term: 再营销人群
    description: 已浏览、已互动、加购未购买等曾与品牌发生过行为的人群。
    sqlFragment: "ap.package_type = 'RETARGETING'"
    synonyms: [ 重定向人群, retargeting, 召回人群 ]

  - term: 相似人群
    description: 根据已购或高价值用户扩展出的相似用户集合。
    sqlFragment: "ap.package_type = 'LOOKALIKE'"
    synonyms: [ Lookalike, LAL, 相似包 ]

  - term: 推广对象
    description: 广告实际推广的SKU、店铺、直播间或落地页。
    sqlFragment: "JOIN ad_group_target_relation tr ON tr.ad_group_id = ag.id JOIN promotion_target pt ON pt.id = tr.promotion_target_id"
    synonyms: [ 商品, SKU, 店铺, 直播间, 落地页, target ]

  - term: 直播间推广
    description: 围绕抖音或快手直播间进行的广告投放。
    sqlFragment: "pt.target_type = 'LIVE_ROOM'"
    synonyms: [ 直播投放, 直播间引流, 直播广告 ]

  - term: 京东关键词
    description: 京东搜索广告中用于匹配用户搜索意图的关键词。
    sqlFragment: "JOIN ad_group_keyword k ON k.ad_group_id = ag.id AND k.status = 1"
    synonyms: [ 搜索词, 搜索关键词, keyword ]

  - term: 消耗
    description: 广告平台报告的实际花费金额。跨日期、账户、计划或渠道汇总时必须使用SUM(cost)。
    sqlFragment: "SUM(p.cost) AS total_cost"
    synonyms: [ 花费, 广告费, 广告消耗, spend, cost ]

  - term: 曝光量
    description: 广告成功展示给用户的次数，使用广告平台日报口径。
    sqlFragment: "SUM(p.impressions) AS total_impressions"
    synonyms: [ 曝光, 展现量, 展示量, impressions ]

  - term: 点击量
    description: 广告被点击的次数，跨维度汇总时使用SUM(clicks)。
    sqlFragment: "SUM(p.clicks) AS total_clicks"
    synonyms: [ 点击数, 点击次数, clicks, click ]

  - term: 点击率
    description: 点击量除以曝光量。不能对每日CTR或单广告CTR直接求平均。
    sqlFragment: "SUM(p.clicks) / NULLIF(SUM(p.impressions), 0) AS ctr"
    synonyms: [ CTR, 点击率 ]

  - term: 点击成本
    description: 平均每次点击的广告消耗。
    sqlFragment: "SUM(p.cost) / NULLIF(SUM(p.clicks), 0) AS cpc"
    synonyms: [ CPC, 单次点击成本 ]

  - term: 千次曝光成本
    description: 获得1000次广告曝光的平均消耗。
    sqlFragment: "SUM(p.cost) * 1000 / NULLIF(SUM(p.impressions), 0) AS cpm"
    synonyms: [ CPM, 千次展示成本 ]

  - term: 平台归因转化
    description: 广告平台依据自身归因规则和归因窗口报告的转化数量，不等于企业真实订单数。
    sqlFragment: "SUM(p.platform_conversions) AS platform_conversions"
    synonyms: [ 转化, 转化量, 平台转化, conversions ]

  - term: 平台转化率
    description: 平台归因转化量除以点击量。
    sqlFragment: "SUM(p.platform_conversions) / NULLIF(SUM(p.clicks), 0) AS platform_cvr"
    synonyms: [ CVR, 转化率, 点击转化率 ]

  - term: 平台转化成本
    description: 平台归因下，每获得一次转化的平均广告消耗。
    sqlFragment: "SUM(p.cost) / NULLIF(SUM(p.platform_conversions), 0) AS platform_cpa"
    synonyms: [ CPA, 转化成本, 单次转化成本 ]

  - term: 平台归因收入
    description: 广告平台回传的归因成交金额或转化价值，不等同于企业财务确认收入。
    sqlFragment: "SUM(p.platform_conversion_value) AS platform_conversion_value"
    synonyms: [ 平台收入, 归因收入, conversion value ]

  - term: 平台ROAS
    description: 广告平台归因收入除以广告平台消耗。当前测试数据均为CNY，可以直接比较。
    sqlFragment: "SUM(p.platform_conversion_value) / NULLIF(SUM(p.cost), 0) AS platform_roas"
    synonyms: [ ROAS, 投产比, 广告回报 ]

  - term: 真实转化
    description: 企业Web、App、小程序、CRM或订单系统确认的注册、留资、加购或购买事件。
    sqlFragment: "COUNT(DISTINCT ce.id) AS confirmed_conversions"
    synonyms: [ 企业转化, 实际转化, confirmed conversion ]

  - term: 已支付订单
    description: 企业订单系统中支付成功且未全额退款的订单。
    sqlFragment: "COUNT(DISTINCT CASE WHEN o.order_status IN ('PAID', 'PARTIALLY_REFUNDED') THEN o.id END) AS paid_orders"
    synonyms: [ 支付订单, 成交订单, paid order ]

  - term: 退款金额
    description: 企业订单系统记录的退款金额。
    sqlFragment: "SUM(o.refund_amount) AS total_refund_amount"
    synonyms: [ 退款, refund ]

  - term: 净收入
    description: 已支付订单的支付金额减去退款金额，属于企业真实财务口径。
    sqlFragment: "SUM(CASE WHEN o.order_status IN ('PAID', 'PARTIALLY_REFUNDED') THEN o.gross_amount - o.refund_amount ELSE 0 END) AS net_revenue"
    synonyms: [ 实收, 净营收, net revenue ]

  - term: 真实ROAS
    description: 企业归因后的净收入除以广告消耗。必须明确归因模型后才可计算。
    sqlFragment: "SUM(ar.attributed_value) / NULLIF(SUM(p.cost), 0) AS actual_roas"
    synonyms: [ 真实投产比, 财务ROAS, actual ROAS ]

  - term: 归因窗口
    description: 将转化归属到此前广告点击或曝光的有效时间范围。当前企业默认点击后7天、曝光后1天。
    sqlFragment: "ar.click_window_days, ar.view_window_days"
    synonyms: [ attribution window, attribution period ]

  - term: 最后非直接点击归因
    description: 将转化归因给转化前最后一次非直接广告点击，是当前测试数据的默认企业归因模型。
    sqlFragment: "ar.attribution_model = 'LAST_NON_DIRECT_CLICK'"
    synonyms: [ 末次点击归因, last non-direct click ]

  - term: 起量
    description: 广告达到企业约定的投放规模门槛，不等于广告状态为ACTIVE。当前未配置统一阈值，查询前必须明确消耗、曝光、点击和连续天数。
    sqlFragment: null
    synonyms: [ 开始放量, 起投, 跑起来 ]

  - term: 跑量
    description: 广告在连续时间内取得一定规模的曝光和消耗，强调规模，不代表CPA或ROAS一定优秀。
    sqlFragment: null
    synonyms: [ 放量, 扩量, 大量投放 ]